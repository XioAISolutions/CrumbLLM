<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#17233c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="620" rx="32" fill="url(#bg)"/>
  <circle cx="1160" cy="80" r="220" fill="#8b5cf6" opacity="0.10"/>
  <circle cx="110" cy="570" r="250" fill="#22d3ee" opacity="0.08"/>

  <text x="72" y="88" fill="#9aa7bd" font-family="Inter,Arial,sans-serif" font-size="22" letter-spacing="4">CRUMBCONTEXT × CRUMBLLM</text>
  <text x="72" y="162" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="800">Give every AI the context it needs.</text>
  <text x="72" y="220" fill="url(#accent)" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="800">Not the entire conversation.</text>
  <text x="72" y="268" fill="#aeb8ca" font-family="Inter,Arial,sans-serif" font-size="23">Exact facts stay exact. Stale context takes the cheaper lane.</text>

  <g transform="translate(72 334)" filter="url(#shadow)">
    <rect width="1136" height="190" rx="24" fill="#0f1726" stroke="#2a3650"/>

    <g transform="translate(28 28)">
      <rect width="188" height="134" rx="18" fill="#151e31" stroke="#33415d"/>
      <text x="22" y="40" fill="#8fa0ba" font-family="Inter,Arial,sans-serif" font-size="15">LONG SESSION</text>
      <text x="22" y="82" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">18,687</text>
      <text x="22" y="108" fill="#7d89a1" font-family="Inter,Arial,sans-serif" font-size="14">estimated tokens</text>
    </g>

    <path d="M236 95 H310" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <path d="M300 84 L314 95 L300 106" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(336 28)">
      <rect width="476" height="134" rx="18" fill="#111a2a" stroke="#33415d"/>
      <text x="22" y="34" fill="#8fa0ba" font-family="Inter,Arial,sans-serif" font-size="15">ROUTE BY MEANING</text>
      <g font-family="ui-monospace,Menlo,monospace" font-size="18">
        <text x="22" y="70" fill="#53f2a3">exact</text><text x="100" y="70" fill="#dce5f5">system · current · hashes · paths</text>
        <text x="22" y="98" fill="#8b5cf6">crumb</text><text x="100" y="98" fill="#dce5f5">memory · handoffs · project state</text>
        <text x="22" y="126" fill="#22d3ee">image</text><text x="100" y="126" fill="#dce5f5">old dense logs after anchors are removed</text>
      </g>
    </g>

    <path d="M832 95 H906" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <path d="M896 84 L910 95 L896 106" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(932 28)">
      <rect width="176" height="134" rx="18" fill="#151e31" stroke="#33415d"/>
      <text x="20" y="40" fill="#8fa0ba" font-family="Inter,Arial,sans-serif" font-size="15">ROUTED</text>
      <text x="20" y="82" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">6,392</text>
      <text x="20" y="108" fill="#53f2a3" font-family="Inter,Arial,sans-serif" font-size="14">31/31 anchors safe</text>
    </g>
  </g>

  <text x="72" y="574" fill="#71809a" font-family="ui-monospace,Menlo,monospace" font-size="18">bash scripts/try-crumbcontext.sh</text>
</svg>
