name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CrumbLLM (independent — no crumb-format)
        run: python -m pip install -e .[dev]

      - name: Enforce independence — bundled reader, no crumb-format imports
        run: |
          python - <<'PY'
          import sys
          # crumb-format must not even be importable here, proving CrumbLLM
          # never relies on it. Block it, then exercise the parse path.
          import importlib.abc, importlib.machinery

          class _Block(importlib.abc.MetaPathFinder):
              def find_spec(self, name, path, target=None):
                  if name in ("crumb_format", "cli", "cli.crumb"):
                      raise ImportError(f"{name} is blocked: CrumbLLM must be independent")
                  return None

          sys.meta_path.insert(0, _Block())

          from crumb_llm.crumb.loader import load_crumb_text
          doc = load_crumb_text(
              "BEGIN CRUMB\nv=1.2\nkind=task\nsource=ci\n---\n"
              "[goal]\ng\n[context]\nc\n[constraints]\nn\nEND CRUMB"
          )
          assert doc.kind == "task", doc.kind

          # And confirm no crumb-format module slipped into the import graph.
          leaked = [m for m in sys.modules if m == "crumb_format" or m.startswith("crumb_format.")]
          assert not leaked, f"crumb-format leaked into sys.modules: {leaked}"
          print("independence OK: parsed via bundled reader with crumb-format blocked")
          PY

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          crumblm --help
          crumblm analyze examples/basic.crumb

  build:
    name: build & verify zero-dependency wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Assert the wheel declares zero required dependencies
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          z = zipfile.ZipFile(whl)
          meta_name = next(n for n in z.namelist() if n.endswith("METADATA"))
          meta = z.read(meta_name).decode()
          core = [
              line for line in meta.splitlines()
              if line.startswith("Requires-Dist:") and "extra ==" not in line
          ]
          assert not core, f"crumb-llm must have zero required deps, found: {core}"
          print("OK: wheel declares zero required dependencies")
          PY

      - name: Install the wheel offline and smoke-test the CLI
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --no-index dist/*.whl
          /tmp/wheel-env/bin/crumblm --version
