name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # crumb_core ships in crumb-format >= 1.2.0, which is merged to main but not
      # yet on PyPI (the index still serves 0.2.0). Install it from source until
      # that release is tagged; the pyproject constraint stays correct for end
      # users, and this step tests the real integration rather than mocking it.
      # Delete this step once crumb-format 1.2.0 is published.
      - name: Install crumb-format from source (pre-release of 1.2.0)
        run: python -m pip install "crumb-format @ git+https://github.com/XioAISolutions/crumb-format@main"

      - name: Install CrumbLLM
        run: python -m pip install -e .[dev]

      - name: Enforce a single CRUMB grammar — no vendored fork
        run: |
          python - <<'PY'
          import sys

          # This job used to assert the opposite: that crumb-format was not even
          # importable, proving CrumbLLM carried its own reader. That independence
          # bought silent divergence — three repositories, three private parsers,
          # and this package's EJA schemas demanding a crumb_version of "1.5" that
          # no spec defines. The grammar now lives once, in crumb_core, and the
          # thing worth enforcing is that we actually use it.
          from crumb_llm.crumb.loader import load_crumb_text

          doc = load_crumb_text(
              "BEGIN CRUMB\nv=1.2\nkind=task\nsource=ci\n---\n"
              "[goal]\ng\n[context]\nc\n[constraints]\nn\nEND CRUMB"
          )
          assert doc.kind == "task", doc.kind

          assert "crumb_core" in sys.modules, (
              "parsing did not go through crumb_core — a vendored fork has crept back in"
          )

          # And no fork may be reintroduced under the old name.
          import importlib.util
          assert importlib.util.find_spec("crumb_llm.crumb.spec") is None, (
              "crumb_llm.crumb.spec is back; the grammar must live only in crumb_core"
          )
          print("single-grammar OK: parsed via crumb_core, no vendored fork present")
          PY

      - name: Enforce that crumb_eja stays separable from crumb_llm
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # EJA is a different format for a different audience, and it is 55% of
          # this repository by line count. It was moved to its own top-level
          # package precisely because it imported nothing from crumb_llm, which
          # made the move a rename rather than a refactor -- and which keeps the
          # eventual split into its own repository a `git mv` plus a pyproject.
          # One convenience import from crumb_llm would quietly cost that, so
          # the property is enforced rather than hoped for.
          offenders = []
          for path in pathlib.Path("crumb_eja").rglob("*.py"):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if re.search(r"\b(from|import)\s+crumb_llm\b", line):
                      offenders.append(f"{path}:{number}: {line.strip()}")
          if offenders:
              print("crumb_eja must not import from crumb_llm:", file=sys.stderr)
              print("\n".join(offenders), file=sys.stderr)
              raise SystemExit(1)
          print("OK: crumb_eja imports nothing from crumb_llm")
          PY

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          crumblm --help
          crumblm score examples/basic.crumb
          crumblm analyze examples/basic.crumb
          crumb-eja validate crumb_eja/examples/einstein-elevator.eja.json
          crumblm eja validate crumb_eja/examples/einstein-elevator.eja.json

  build:
    name: build & verify the wheel's dependency surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # crumb_core ships in crumb-format >= 1.2.0, which is merged to main but not
      # yet on PyPI (the index still serves 0.2.0). Install it from source until
      # that release is tagged; the pyproject constraint stays correct for end
      # users, and this step tests the real integration rather than mocking it.
      # Delete this step once crumb-format 1.2.0 is published.
      - name: Install crumb-format from source (pre-release of 1.2.0)
        run: python -m pip install "crumb-format @ git+https://github.com/XioAISolutions/crumb-format@main"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Assert the wheel's required dependencies stay on the allowlist
        run: |
          python - <<'PY'
          import glob, re, zipfile

          # This job used to require *zero* dependencies. That rule, together with
          # the meta-path finder that made crumb_format unimportable, is what kept
          # a 334-line fork of the CRUMB grammar in this repo -- a fork nothing
          # tested against the canonical parser, and which drifted. The intent
          # worth preserving is "no heavy dependency tree", not "no dependencies",
          # so exactly one is allowed: the parser itself, which is stdlib-only and
          # dependency-free. Anything else still fails.
          ALLOWED = {"crumb-format"}

          whl = sorted(glob.glob("dist/*.whl"))[-1]
          z = zipfile.ZipFile(whl)
          meta_name = next(n for n in z.namelist() if n.endswith("METADATA"))
          meta = z.read(meta_name).decode()
          core = [
              line for line in meta.splitlines()
              if line.startswith("Requires-Dist:") and "extra ==" not in line
          ]
          names = {
              re.split(r"[\s\[<>=!;(]", line.split(":", 1)[1].strip(), 1)[0].strip().lower()
              for line in core
          }
          unexpected = sorted(names - ALLOWED)
          assert not unexpected, (
              f"crumb-llm gained required deps outside the allowlist {sorted(ALLOWED)}: {unexpected}"
          )
          print(f"OK: required deps within allowlist -> {sorted(names) or 'none'}")
          PY

      - name: Install the wheel offline and smoke-test the CLI
        run: |
          python -m venv /tmp/wheel-env
          # crumb-format is a real dependency now, so a strictly offline install
          # cannot resolve it. Install the dependency first, then the wheel with
          # --no-deps, which still proves the wheel itself is self-contained.
          /tmp/wheel-env/bin/pip install "crumb-format @ git+https://github.com/XioAISolutions/crumb-format@main"
          /tmp/wheel-env/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-env/bin/crumblm --version

  quickstart:
    name: the README's install and first command, exactly as written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The other jobs install crumb-format from git before touching this
      # package, which is why they stayed green while `pip install
      # git+.../CrumbLLM` -- the command the README put first -- failed for
      # every real user: crumb-format>=1.2.0 does not exist on PyPI, only
      # 0.2.0 does. A green CI over a broken quickstart is worse than a red
      # one, so this job runs what the README tells a stranger to run, in a
      # clean environment, with no help from the steps above.
      - name: Run every pip command the README documents, in order
        run: |
          set -euo pipefail
          python -m venv /tmp/quickstart
          python - <<'EXTRACT' > /tmp/install-commands.sh
          import pathlib, re

          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          block = re.search(r"<!-- install:start -->(.*?)<!-- install:end -->", readme, re.S)
          assert block, "README lost its <!-- install:start --> marker"
          commands = [
              line.strip()
              for line in block.group(1).splitlines()
              if line.strip().startswith("pip install")
          ]
          assert commands, "no pip install command found between the install markers"
          for command in commands:
              print(command.replace("pip install", "/tmp/quickstart/bin/pip install", 1))
          EXTRACT
          cat /tmp/install-commands.sh
          bash -euo pipefail /tmp/install-commands.sh

      # The step above proves the documented commands *resolve and complete*,
      # but `pip install git+...CrumbLLM` fetches the default branch, so on a
      # pull request it installed main rather than the change under review.
      # Overlay the checkout so the README's first command runs against this
      # branch's code, in the environment the README's own install produced.
      - name: Overlay the branch under review
        run: /tmp/quickstart/bin/pip install --no-deps -e .

      - name: Run the README's first command
        run: |
          /tmp/quickstart/bin/crumblm score examples/weak-handoff.crumb --min 0.6 && {
            echo "the weak example must fail a 0.6 gate; it did not" >&2
            exit 1
          }
          /tmp/quickstart/bin/crumblm score examples/basic.crumb --min 0.6
          /tmp/quickstart/bin/crumblm analyze examples/basic.crumb
