name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CrumbLLM (standalone — no crumb-format)
        run: python -m pip install -e .[dev]

      - name: Enforce standalone — bundled CRUMB reader is active
        run: |
          python - <<'PY'
          from crumb_llm.crumb import parser_adapter as pa
          fn = pa._resolve_parser()
          where = f"{fn.__module__}.{fn.__name__}"
          assert fn.__module__ == "crumb_llm.crumb.spec", (
              f"expected the bundled reader, got {where} — crumb-format must not be a runtime dependency"
          )
          print("standalone OK:", where)
          PY

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          crumblm --help
          crumblm analyze examples/basic.crumb
