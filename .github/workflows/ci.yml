name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # crumb_core ships in crumb-format >= 1.2.0, which is merged to main but not
      # yet on PyPI (the index still serves 0.2.0). Install it from source until
      # that release is tagged; the pyproject constraint stays correct for end
      # users, and this step tests the real integration rather than mocking it.
      # Delete this step once crumb-format 1.2.0 is published.
      - name: Install crumb-format from source (pre-release of 1.2.0)
        run: python -m pip install "crumb-format @ git+https://github.com/XioAISolutions/crumb-format@main"

      - name: Install CrumbLLM
        run: python -m pip install -e .[dev]

      - name: Enforce a single CRUMB grammar — no vendored fork
        run: |
          python - <<'PY'
          import sys

          # This job used to assert the opposite: that crumb-format was not even
          # importable, proving CrumbLLM carried its own reader. That independence
          # bought silent divergence — three repositories, three private parsers,
          # and this package's EJA schemas demanding a crumb_version of "1.5" that
          # no spec defines. The grammar now lives once, in crumb_core, and the
          # thing worth enforcing is that we actually use it.
          from crumb_llm.crumb.loader import load_crumb_text

          doc = load_crumb_text(
              "BEGIN CRUMB\nv=1.2\nkind=task\nsource=ci\n---\n"
              "[goal]\ng\n[context]\nc\n[constraints]\nn\nEND CRUMB"
          )
          assert doc.kind == "task", doc.kind

          assert "crumb_core" in sys.modules, (
              "parsing did not go through crumb_core — a vendored fork has crept back in"
          )

          # And no fork may be reintroduced under the old name.
          import importlib.util
          assert importlib.util.find_spec("crumb_llm.crumb.spec") is None, (
              "crumb_llm.crumb.spec is back; the grammar must live only in crumb_core"
          )
          print("single-grammar OK: parsed via crumb_core, no vendored fork present")
          PY

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          crumblm --help
          crumblm analyze examples/basic.crumb

  build:
    name: build & verify the wheel's dependency surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # crumb_core ships in crumb-format >= 1.2.0, which is merged to main but not
      # yet on PyPI (the index still serves 0.2.0). Install it from source until
      # that release is tagged; the pyproject constraint stays correct for end
      # users, and this step tests the real integration rather than mocking it.
      # Delete this step once crumb-format 1.2.0 is published.
      - name: Install crumb-format from source (pre-release of 1.2.0)
        run: python -m pip install "crumb-format @ git+https://github.com/XioAISolutions/crumb-format@main"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Assert the wheel's required dependencies stay on the allowlist
        run: |
          python - <<'PY'
          import glob, re, zipfile

          # This job used to require *zero* dependencies. That rule, together with
          # the meta-path finder that made crumb_format unimportable, is what kept
          # a 334-line fork of the CRUMB grammar in this repo -- a fork nothing
          # tested against the canonical parser, and which drifted. The intent
          # worth preserving is "no heavy dependency tree", not "no dependencies",
          # so exactly one is allowed: the parser itself, which is stdlib-only and
          # dependency-free. Anything else still fails.
          ALLOWED = {"crumb-format"}

          whl = sorted(glob.glob("dist/*.whl"))[-1]
          z = zipfile.ZipFile(whl)
          meta_name = next(n for n in z.namelist() if n.endswith("METADATA"))
          meta = z.read(meta_name).decode()
          core = [
              line for line in meta.splitlines()
              if line.startswith("Requires-Dist:") and "extra ==" not in line
          ]
          names = {
              re.split(r"[\s\[<>=!;(]", line.split(":", 1)[1].strip(), 1)[0].strip().lower()
              for line in core
          }
          unexpected = sorted(names - ALLOWED)
          assert not unexpected, (
              f"crumb-llm gained required deps outside the allowlist {sorted(ALLOWED)}: {unexpected}"
          )
          print(f"OK: required deps within allowlist -> {sorted(names) or 'none'}")
          PY

      - name: Install the wheel offline and smoke-test the CLI
        run: |
          python -m venv /tmp/wheel-env
          # crumb-format is a real dependency now, so a strictly offline install
          # cannot resolve it. Install the dependency first, then the wheel with
          # --no-deps, which still proves the wheel itself is self-contained.
          /tmp/wheel-env/bin/pip install "crumb-format @ git+https://github.com/XioAISolutions/crumb-format@main"
          /tmp/wheel-env/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-env/bin/crumblm --version
