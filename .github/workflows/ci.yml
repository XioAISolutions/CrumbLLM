name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CrumbLLM (standalone — no crumb-format)
        run: python -m pip install -e .[dev]

      - name: Enforce standalone — bundled CRUMB reader is active
        run: |
          python - <<'PY'
          from crumb_llm.crumb import parser_adapter as pa
          fn = pa._resolve_parser()
          where = f"{fn.__module__}.{fn.__name__}"
          assert fn.__module__ == "crumb_llm.crumb.spec", (
              f"expected the bundled reader, got {where} — crumb-format must not be a runtime dependency"
          )
          print("standalone OK:", where)
          PY

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          crumblm --help
          crumblm analyze examples/basic.crumb

  build:
    name: build & verify zero-dependency wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Assert the wheel declares zero required dependencies
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          z = zipfile.ZipFile(whl)
          meta_name = next(n for n in z.namelist() if n.endswith("METADATA"))
          meta = z.read(meta_name).decode()
          core = [
              line for line in meta.splitlines()
              if line.startswith("Requires-Dist:") and "extra ==" not in line
          ]
          assert not core, f"crumb-llm must have zero required deps, found: {core}"
          print("OK: wheel declares zero required dependencies")
          PY

      - name: Install the wheel offline and smoke-test the CLI
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --no-index dist/*.whl
          /tmp/wheel-env/bin/crumblm --version
