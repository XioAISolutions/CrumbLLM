name: CrumbContext

on:
  pull_request:
    paths:
      - "incubator/crumbcontext/**"
      - ".github/workflows/crumbcontext.yml"
  push:
    branches: [main]
    paths:
      - "incubator/crumbcontext/**"
      - ".github/workflows/crumbcontext.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: incubator/crumbcontext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: crumbcontext demo --out /tmp/crumbcontext-demo
      - run: test -f /tmp/crumbcontext-demo/report.html
