name: Publish to PyPI

# Publishes crumb-llm to PyPI when a GitHub Release is published.
#
# One-time setup (no API token needed — uses PyPI Trusted Publishing / OIDC):
#   1. On PyPI, add a Trusted Publisher for project "crumb-llm":
#      owner "XioAISolutions", repo "CrumbLLM",
#      workflow "publish.yml", environment "pypi".
#   2. In GitHub, create an Environment named "pypi"
#      (Settings -> Environments).
# Publishing a Release (e.g. for tag v0.1.0) then builds and uploads the dist.

on:
  release:
    types: [published]

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
