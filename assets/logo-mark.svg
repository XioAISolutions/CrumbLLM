<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CrumbLLM">
  <title>CrumbLLM</title>
  <!-- A trail of crumbs: the handoff between sessions, which is the whole
       product. Crumbs grow along the path because what a handoff carries
       forward is what survives; a truncated transcript loses the start. -->
  <path d="M8 44 Q22 20 38 30 T58 16" fill="none" stroke="#8b5cf6" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="1 7" opacity="0.55"/>
  <circle cx="9" cy="45" r="3.2" fill="#8b5cf6" opacity="0.35"/>
  <circle cx="20" cy="31" r="4.4" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="34" cy="31" r="5.6" fill="#53f2a3"/>
  <circle cx="52" cy="19" r="7.4" fill="#53f2a3"/>
</svg>
